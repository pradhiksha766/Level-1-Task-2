<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Addition Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay">

    <div class="container">
        <h1>Addition Calculator</h1>
        

        <button id="startBtn" class="start-btn">
            Let's Get Started
        </button>

        <div id="calculatorSection" class="calculator" style="display:none;">
            <h2>Enter Two Numbers</h2>

            <input type="number" id="value1" placeholder="Enter Value 1">
            <input type="number" id="value2" placeholder="Enter Value 2">

            <button id="calculateBtn" class="calc-btn">
                Calculate
            </button>

            <div class="result-box">
                Result: <span id="result">0</span>
            </div>
        </div>
    </div>

</div>

<!-- MODAL -->
<div id="modal" style="display:none;" class="modal">
    <div class="modal-content">
        <h2 id="greetingText"></h2>
        <button id="closeModal" class="modal-btn">OK</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
